name: pmintel

x-app: &app
  build: ./app
  image: pmintel-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql://pmintel:${POSTGRES_PASSWORD}@db:5432/pmintel
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pmintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pmintel
      TS_TUNE_MEMORY: 4GB
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmintel -d pmintel"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    <<: *app
    command: ["python", "-m", "pmintel.collector"]

  # ETF paper study v2: runs after the US close on weekdays (paper only, no broker)
  etf:
    <<: *app
    command: ["python", "-m", "pmintel.etf_job"]

  # Tip tracker: read-only Telegram listener (owner's account) + outcome updates
  tips:
    <<: *app
    command: ["python", "-m", "pmintel.tips_telegram"]
    volumes:
      - tgdata:/data

  api:
    <<: *app
    command: ["uvicorn", "pmintel.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: timescale/timescaledb:latest-pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U pmintel -Fc pmintel > /backups/pmintel-$$(date +%F).dump.tmp \
            && mv /backups/pmintel-$$(date +%F).dump.tmp /backups/pmintel-$$(date +%F).dump
          find /backups -name 'pmintel-*.dump' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-off jobs:  docker compose run --rm backfill [--since 2025-01-01 --limit 500]
  backfill:
    <<: *app
    entrypoint: ["python", "-m", "pmintel.backfill"]
    command: []
    restart: "no"
    profiles: ["jobs"]

  research:
    <<: *app
    entrypoint: ["python", "-m", "pmintel.research"]
    command: []
    restart: "no"
    profiles: ["jobs"]

volumes:
  tgdata:
  dbdata:
  caddy_data:
  caddy_config:
